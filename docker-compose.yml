services:
  quickshare:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${QUICKSHARE_PORT:-8090}:3000"
    environment:
      QUICKSHARE_TOKEN: ${QUICKSHARE_TOKEN:?Set a private publish token}
      BASE_URL: ${BASE_URL:-http://127.0.0.1:8090}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      OBJECT_STORE: ${OBJECT_STORE:-filesystem}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_PREFIX: ${S3_PREFIX:-quickshare/objects/}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    volumes:
      - quickshare-data:/app/data
    mem_limit: 256m
    cpus: 1.0
volumes:
  quickshare-data:
