<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>形状记忆</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #e2e8ec;
      color: #344550;
      font: 16px/1.6 system-ui;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(640px, 95vw);
      padding: 30px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
    }
    small {
      font: 12px monospace;
      letter-spacing: 0.13em;
    }
    h1 {
      font-size: 35px;
      margin: 6px 0;
    }
    p {
      margin: 0;
      color: #60737e;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 25px 0;
    }
    .tile {
      aspect-ratio: 1.2;
      border: 0;
      border-radius: 12px;
      font-size: 38px;
      background: #bbcbd6;
      color: #526c7c;
      cursor: pointer;
      box-shadow: 0 3px 0 #9aacb7;
    }
    .tile.open,
    .tile.matched {
      background: #f4eddd;
      color: #a27745;
    }
    .tile.matched {
      background: #bccfba;
      color: #3b6240;
      box-shadow: none;
    }
    #reset {
      padding: 9px 17px;
      border: 1px solid #96aab7;
      background: transparent;
      border-radius: 6px;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    #status {
      min-height: 25px;
    }
    @media (max-width: 480px) {
      main {
        padding: 20px;
      }
      .grid {
        gap: 9px;
      }
      .tile {
        font-size: 29px;
      }
      h1 {
        font-size: 29px;
      }
    }
  </style>
  <main>
    <header>
      <div>
        <small>SHAPE MEMORY</small>
        <h1>翻开，记住，再相遇。</h1>
        <p>找到六对相同的形状。</p>
      </div>
      <button id="reset">重新开始</button>
    </header>
    <div class="grid" id="grid"></div>
    <p id="status" role="status">翻开任意一张，开始吧。</p>
  </main>
  <script>
    const grid = document.querySelector("#grid"),
      status = document.querySelector("#status");
    let opened = [],
      matched = 0,
      turns = 0,
      lock = false,
      pending;
    function reset() {
      clearTimeout(pending);
      opened = [];
      matched = 0;
      turns = 0;
      lock = false;
      const symbols = ["●", "◆", "▲", "■", "✦", "◒"];
      const deck = [...symbols, ...symbols];
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      grid.replaceChildren(
        ...deck.map((s, i) => {
          const b = document.createElement("button");
          b.className = "tile";
          b.textContent = "＋";
          b.setAttribute("aria-label", "翻开第 " + (i + 1) + " 张");
          b.onclick = () => {
            if (
              lock ||
              b.classList.contains("open") ||
              b.classList.contains("matched")
            )
              return;
            b.textContent = s;
            b.classList.add("open");
            opened.push({ b, s });
            if (opened.length === 2) {
              turns++;
              if (opened[0].s === s) {
                opened.forEach((x) => {
                  x.b.className = "tile matched";
                  x.b.disabled = true;
                });
                matched++;
                opened = [];
                status.textContent =
                  matched === 6
                    ? "全部找到了！一共 " + turns + " 次尝试。"
                    : "已找到 " + matched + " / 6 对 · " + turns + " 次尝试";
              } else {
                lock = true;
                pending = setTimeout(() => {
                  opened.forEach((x) => {
                    x.b.classList.remove("open");
                    x.b.textContent = "＋";
                  });
                  opened = [];
                  lock = false;
                }, 850);
                status.textContent = "再想一想 · " + turns + " 次尝试";
              }
            }
          };
          return b;
        }),
      );
      status.textContent = "翻开任意一张，开始吧。";
    }
    document.querySelector("#reset").onclick = reset;
    reset();
  </script>
</html>
